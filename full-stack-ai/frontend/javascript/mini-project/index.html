<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Counter- Even, Odd, Prime</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="heading">
        <h1>Increment The Number Check Number : Even : Odd : Prime</h1>
    </div>
    <div class="card">
      <div class="counter">
        <h2>Number : <span>0</span></h2>
      </div>
      <div class="tag-section">
          <p class="tag" id="even">Even</p>
          <p class="tag" id="odd">Odd</p>
          <p class="tag" id="prime">Prime</p>
      </div>
      <div class="footer">
        <button id="increment">+1 Add</button>
      <button id="reset">0 Reset</button>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
