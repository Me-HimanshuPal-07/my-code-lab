<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hero</title>
    <link rel="stylesheet" href="task.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400..800&family=Plus+Jakarta+Sans:wght@200..800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header>
      <!-- Nikatam Logo -->
      <div class="nikatam-logo">
        <img src="./Images/nikatam-logo.png" alt="Nikatam Logo" />
      </div>
      <!-- Hamburger button -->
      <button class="hamburger" aria-label="Toggle Menu" type="button">
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
      </button>
    </header>
    <main>
      <section class="hero-container">
        <div class="hero-left">
          <p class="tagline">
            <span aria-hidden="true">~</span> HYPERLOCAL PLATFORM
          </p>
          <h1>JO Chaiye,<br />Vo Nikatam.</h1>
          <p class="description">
            Nikatam connects you with the best local shops and services in your
            neighborhood. Discover the magic of local commerce.
          </p>
          <button type="button">Get Started</button>
        </div>
        <div class="hero-right">
          <div class="taau-img">
            <img src="./Images/nikku-taau.png" alt="Nikatam Moscot Character Nikku Tau" />
          </div>
          <div class="nav-dots" aria-hidden="true">
            <div class="dot active"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
