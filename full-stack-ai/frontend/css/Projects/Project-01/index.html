<!Doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Microsoft</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <main>
      <nav>
        <div class="left">
          <img
            width="110px"
            src="https://uhf.microsoft.com/images/microsoft/RE1Mu3b.png"
            alt="Microsoft-logo"
          />
          <p>Microsoft 365</p>
          <p>Azure</p>
          <p>Copilot</p>
          <p>Windows</p>
          <p>Surface</p>
          <p>Xbox</p>
          <p>Support</p>
        </div>
        <div class="right">
          <p>All Microsoft <span><i class="ri-arrow-down-s-line"></i> </span></p>
          <p>Search <span><i class="ri-search-line"></i></span></p>
          <p>Cart <span><i class="ri-shopping-cart-2-line"></i></span></p>
          <div class="profile"></div>
        </div>
      </nav>
      <section>
        <img src="https://cdn-dynmedia-1.microsoft.com/is/image/microsoftcorp/Hero-Desktop-Surface-Family-Pro-Snapdragon-13in-12Ed-Laptop-15in-8Ed-Black-Platinum-Homepage?resMode=sharp2&op_usm=1.5,0.65,15,0&wid=3840&hei=2160&qlt=85&fit=constrain" alt="bannerimage.jpg">
        <div class="content">
            <span>New</span>
            <h1>Meet the newest Surface devices</h1>
            <p>Do more with Surface Laptop and Surface Pro – supercharged productivity, all-day battery life and built-in privacy and data protection.*</p>
            <button>Learn more</button>
        </div>
      </section>
    </main>
  </body>
</html>
